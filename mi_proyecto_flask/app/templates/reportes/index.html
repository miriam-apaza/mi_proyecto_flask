{% extends "appbuilder/base.html" %}
{% block content %}
<div class="container fluid">
    <h2 class="my-4">Panel de Control Académico</h2>
    <div class="row">
        <div class="col-md-4">
            <div class="panel panel-primary">
                <div class="panel-heading">Estudiantes Activos</div>
                <div class="panel-body"><h3>{{ total_estudiantes }}</h3></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="panel panel-success">
                <div class="panel-heading">Total Cursos</div>
                <div class="panel-body"><h3>{{ total_cursos }}</h3></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="panel panel-info">
                <div class="panel-heading">Total Inscripciones</div>
                <div class="panel-body"><h3>{{ total_inscripciones }}</h3></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
