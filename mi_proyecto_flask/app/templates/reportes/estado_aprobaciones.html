{% extends "appbuilder/base.html" %}
{% block content %}
<div class="container">
    <h2 class="my-4">Estado Global de Aprobaciones</h2>
    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>Estado del Alumno</th>
                <th>Cantidad Total</th>
            </tr>
        </thead>
        <tbody>
            {% for fila in datos %}
            <tr>
                <td><strong>{{ fila.estado_inscripcion }}</strong></td>
                <td>{{ fila.total }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
