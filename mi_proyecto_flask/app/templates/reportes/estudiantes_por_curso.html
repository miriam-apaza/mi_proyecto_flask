{% extends "appbuilder/base.html" %}
{% block content %}
<div class="container">
    <h2 class="my-4">Estudiantes Inscritos por Curso</h2>
    <table class="table table-striped table-bordered">
        <thead>
            <tr>
                <th>Curso</th>
                <th>Total Inscritos</th>
            </tr>
        </thead>
        <tbody>
            {% for fila in datos %}
            <tr>
                <td>{{ fila.curso }}</td>
                <td><span class="badge">{{ fila.total_inscritos }}</span></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
